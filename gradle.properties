# Memoria máxima para el proceso de Gradle y codificación de archivos
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Usar librerías AndroidX (obligatorio en AGP 8 con Compose)
android.useAndroidX=true
# Estilo de código Kotlin oficial
kotlin.code.style=official
# Cada módulo genera su propia clase R, más liviana
android.nonTransitiveRClass=true